#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC

#Gradle
# All Gradle workers share this one daemon heap. Many agents build at the same time on one
# computer, so CLAUDE.md gives the flags for each local call (--max-workers=4 and -Xmx6g).
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.daemon.performance.disable-logging=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Compose KMP
compose.resources.always.generate.accessors=true
