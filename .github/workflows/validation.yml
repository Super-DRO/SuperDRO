name: Validate
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize ]
  # A push to main runs the same matrix and writes the Gradle caches. A pull request job reads
  # the newest entry of its own job and matrix values.
  push:
    branches: [ main ]

# A new push to a pull request cancels the older run of that pull request. A run on main is not
# cancelled, because it writes the caches that the pull request jobs read.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job gets only the token scopes that it needs.
permissions:
  contents: read

jobs:
  # The release scripts under scripts/ have unit tests. release.yml runs them before it makes a
  # tag. This job runs them on each pull request too, so that a defect shows before the release
  # day. The tests need no Gradle and take a few seconds.
  scripts:
    name: Validate (release scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Test the release scripts
        run: python3 -m unittest discover -s scripts/tests

  validate:
    name: Validate (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # setup-gradle writes a comment on a pull request when a job fails.
      pull-requests: write
    strategy:
      # A failure of one target does not cancel the other target.
      fail-fast: false
      matrix:
        # The root build.gradle.kts defines validateAndroid and validateJvm, so that local checks
        # and CI run the same task graphs.
        #
        #   android  the debug and release APKs of both apps, a compile check of the Baseline
        #            Profile generator and of the instrumented tests, and `lint`.
        #   jvm      the JVM unit tests of all common modules (with the PNG render of App()),
        #            the traceability tests of :validation, the localization check, and the
        #            migration check of the database.
        include:
          - target: android
            tasks: "validateAndroid"
          - target: jvm
            tasks: "validateJvm"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The build runs third-party Gradle plugins. Do not keep the token in .git/config.
          persist-credentials: false

      # The JetBrains JDK: gradle/gradle-daemon-jvm.properties makes the Gradle daemon run on a
      # JetBrains JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          # The default package list of the action asks for the old package 'tools', which the
          # SDK repository does not have. AGP installs the platform 37 and the build tools.
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only a run on main writes the caches. A pull request run reads them, so that its
          # entries do not push the main entries out of the cache. Each job has its own Gradle
          # User Home entry (the key holds the job name and the matrix values). The action
          # also saves the caches when the job fails.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # The action saves the configuration cache only with this key (a base64 AES key from
          # `openssl rand -base64 16`). Without it, each job calculates the task graph again, which
          # takes 25 to 40 s. With no secret, the action only skips the configuration cache.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary-as-pr-comment: 'on-failure'

      # composite is a separate Gradle build. No root task gets to it, so its tests run here.
      # They guard the localization rules, the version rules, and the parity of the two copies
      # of buildLogicVersion(). --no-daemon: the composite build has different JVM arguments.
      - name: Test build logic (composite)
        if: matrix.target == 'jvm'
        run: ./gradlew -p composite test --no-daemon --stacktrace -Dorg.gradle.console=plain

      # The build also runs when the composite tests fail, and --continue runs all tasks that
      # do not depend on a failed task. Thus a failed run on main still puts the outputs of
      # all other tasks in the build cache, and the next pull request run gets them.
      - name: Build ${{ matrix.target }}
        if: ${{ !cancelled() }}
        run: ./gradlew ${{ matrix.tasks }} --continue --stacktrace -Dorg.gradle.console=plain

      # The PNG files of the App() render, so that a reviewer can see the UI of the change.
      - name: Upload the screenshots
        if: matrix.target == 'jvm' && always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: core/ui/build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      # The console gives only the name of a failed test. The reports hold the message.
      - name: Upload the test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.target }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-*
            **/build/reports/localization/
            composite/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
