#Kotlin
kotlin.code.style=official
# Keep these JVM arguments identical to the root gradle.properties. The Kotlin daemons are
# keyed by their JVM arguments, so a difference starts a second Kotlin daemon.
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC

#Gradle
org.gradle.jvmargs=-Xms512m -Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
