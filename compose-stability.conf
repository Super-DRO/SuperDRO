// The stability configuration of the Compose compiler. The root build.gradle.kts gives this file
// to each module with the Compose compiler plugin.
//
// The Compose compiler does not infer the stability of a class from a module that it did not
// compile. Thus it treats these types as unstable. The types below are immutable, so a
// composable can skip when an argument of such a type is equal to the previous one.
//
// Add a type only when all of its properties are `val` and all of their types are immutable.

// The read-only collection interfaces of Kotlin. The element types decide the stability (`_`).
// SuperDRO never casts a read-only collection to a mutable one.
kotlin.collections.Collection<_>
kotlin.collections.List<_>
kotlin.collections.Set<_>
kotlin.collections.Map<_,_>

// The immutable value types of the Kotlin standard library and of kotlinx-datetime.
kotlin.time.Instant
kotlin.time.Duration
kotlin.uuid.Uuid
kotlinx.datetime.*

// core:model has only data classes with `val` properties, enums, and objects. The property
// types are primitives, String, enums, kotlin.time.Instant, other core:model types, and the
// read-only collections above.
org.superdro.core.model.*
